# 저장소 맨 위(루트)에 zip 파일을 올리면 자동으로 압축을 풀어 파일로 바꿔 줍니다.
name: zip 자동 풀기

on:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write
  pages: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: zip 풀기
        run: |
          python3 - <<'PY'
          import glob, os, zipfile
          zips = glob.glob('*.zip')
          for z in zips:
              with zipfile.ZipFile(z) as zf:
                  items = []
                  for info in zf.infolist():
                      name = info.filename
                      if not (info.flag_bits & 0x800):          # 윈도우에서 만든 zip의 한글 파일명 복원
                          try: name = name.encode('cp437').decode('cp949')
                          except Exception: pass
                      items.append((info, name.replace('\\', '/')))
                  names = [n for _, n in items if not n.startswith('__MACOSX/') and n]
                  tops = {n.split('/')[0] for n in names}
                  top = tops.pop() if len(tops) == 1 else None
                  strip = bool(top) and all(n.startswith(top + '/') for n in names)
                  for info, name in items:
                      if info.is_dir() or name.startswith('__MACOSX/'):
                          continue
                      rel = name[len(top) + 1:] if strip else name
                      parts = [p for p in rel.split('/') if p]
                      if not parts or '..' in parts or rel.startswith('/'):
                          continue
                      if parts[0] in ('.github', '.git') or parts[-1] == '.DS_Store':
                          continue                               # 보안: 자동 실행 설정은 zip으로 바꾸지 않음
                      dest = os.path.join(*parts)
                      os.makedirs(os.path.dirname(dest) or '.', exist_ok=True)
                      with zf.open(info) as src, open(dest, 'wb') as out:
                          out.write(src.read())
                      print('풀었음:', dest)
              os.remove(z)
          if not zips:
              print('zip 파일이 없습니다')
          PY

      - name: 변경 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "바뀐 내용 없음"; exit 0; fi
          git commit -m "zip 자동 풀기"
          git push

      - name: 사이트 다시 배포 요청
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
